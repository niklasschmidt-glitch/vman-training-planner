name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Hent projektfiler
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_windows.txt

      - name: Installer afhængigheder
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_windows.txt

      - name: Byg programmet
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --noupx `
            --name "VMAN Training Planner 1.00" `
            --icon "vman_engine\assets\vman_training_planner.ico" `
            --add-data "vman_engine\assets;vman_engine\assets" `
            --add-data "vman_engine\manuals;vman_engine\manuals" `
            --add-data "presets;presets" `
            run_app.py

          Copy-Item `
            "README_FOR_USERS.txt" `
            "dist\VMAN Training Planner 1.00\README.txt"

          Compress-Archive `
            -Path "dist\VMAN Training Planner 1.00" `
            -DestinationPath "VMAN_Training_Planner_1.00_Windows.zip" `
            -Force

      - name: Gem Windows-versionen
        uses: actions/upload-artifact@v4
        with:
          name: VMAN_Training_Planner_1.00_Windows
          path: VMAN_Training_Planner_1.00_Windows.zip
          if-no-files-found: error
